name: AirMic
options:
  bundleIdPrefix: com.mdadibazam
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.10
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  AirMic:
    type: application
    platform: iOS
    sources: [AirMic]
    info:
      path: AirMic/Resources/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mdadibazam.AirMic
        PRODUCT_NAME: AirMic
        TARGETED_DEVICE_FAMILY: "1"
  AirMicTests:
    type: bundle.unit-test
    platform: iOS
    sources: [AirMicTests]
    dependencies:
      - target: AirMic
