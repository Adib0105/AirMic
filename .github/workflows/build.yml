name: Build and test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore windows/AirMic.sln
      - run: dotnet build windows/AirMic.sln --configuration Release --no-restore
      - run: dotnet test windows/AirMic.sln --configuration Release --no-build

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: cd ios && xcodegen generate
      - run: >-
          cd ios && xcodebuild -project AirMic.xcodeproj -scheme AirMic
          -sdk iphonesimulator -destination 'platform=iOS Simulator,name=iPhone 16 Pro'
          CODE_SIGNING_ALLOWED=NO test

  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'cryptography==46.0.0'
      - run: python scripts/protocol_smoke_test.py
